name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Ensure ShellCheck
        run: command -v shellcheck >/dev/null || brew install shellcheck
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/bash -n deploy/install-autodeploy.sh
          /bin/bash deploy/tests/install-autodeploy-runtime-mode-test.sh
          /bin/bash -n deploy/sub2api-autodeploy.sh
          /bin/bash -n deploy/sub2api-github-image-release.sh
          /bin/bash deploy/tests/autodeploy-control-flow-test.sh
          /bin/bash deploy/tests/github-image-release-test.sh
          /bin/bash deploy/tests/server-release-container-guard-test.sh
          /bin/bash -n deploy/sub2api-maintenance-lock.sh
          /bin/bash deploy/tests/maintenance-lock-test.sh
          /bin/bash -n deploy/sub2api-drain-monitor.sh
          /bin/bash deploy/tests/drain-monitor-lock-test.sh
          /bin/bash -n deploy/sub2api-runtime-guard.sh
          /bin/bash deploy/tests/runtime-guard-test.sh
          /bin/bash -n deploy/sub2api-github-deploy-trigger.sh
          /bin/bash -n deploy/install-github-deploy-trigger.sh
          /bin/bash -n deploy/sub2api-server-release.sh
          /bin/bash -n deploy/sub2api-blue-green-release.sh
          /bin/bash -n deploy/sub2api-real-request-probe.sh
          /bin/bash deploy/tests/real-request-probe-test.sh
          /bin/bash deploy/tests/blue-green-external-runtime-mock-test.sh
          /bin/bash -n deploy/sub2api-unified-payment-config.sh
          /bin/bash deploy/tests/unified-payment-config-test.sh
          /bin/bash -n deploy/sub2api-unified-payment-vault-container.sh
          /bin/bash deploy/tests/unified-payment-vault-container-test.sh
          /bin/bash -n deploy/sub2api-cert-receiver.sh
          /bin/bash -n deploy/sub2api-cert-deploy-trigger.sh
          /bin/bash -n deploy/install-sub2api-cert-receiver.sh
          /bin/bash deploy/tests/install-sub2api-cert-receiver-test.sh
          /bin/bash deploy/tests/certificate-receiver-test.sh
          /bin/bash -n deploy/install-sub2api-fixed-egress.sh
          /bin/bash deploy/tests/fixed-egress-test.sh
          /bin/bash -n deploy/sub2api-node-state.sh
          /bin/bash deploy/tests/node-state-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v deploy.tests.test_verify_image_route_contract
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v deploy.tests.test_gateway_caddy_route_drift
          /bin/bash deploy/gcp-taiwan-line/tests/transport-config-test.sh
          shellcheck \
            deploy/gcp-taiwan-line/azure-caddy-listeners.sh \
            deploy/gcp-taiwan-line/gcp-startup-bootstrap.sh \
            deploy/gcp-taiwan-line/gcp-update-bootstrap.sh \
            deploy/gcp-taiwan-line/install-gcp-haproxy.sh \
            deploy/gcp-taiwan-line/verify-transport.sh \
            deploy/gcp-taiwan-line/tests/transport-config-test.sh

  docker-bind-mount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify Docker and preload the pinned bind-mount image
        run: |
          test_image='alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
          docker version --format '{{.Server.Version}}'
          docker pull "$test_image"
          docker image inspect "$test_image" --format '{{.Id}}'
      - name: Verify node-state bind-mount updates in a real container
        env:
          SUB2API_NODE_STATE_DOCKER_BIND_REQUIRE: '1'
        run: /bin/bash deploy/tests/node-state-docker-bind-test.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend
