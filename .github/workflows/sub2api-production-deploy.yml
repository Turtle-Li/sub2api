name: Deploy Sub2API production

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Build a verified image artifact without deploying any host'
        required: false
        type: boolean
        default: false

# A production release is always explicit. GitHub builds the exact main commit
# into a linux/amd64 image, compresses its Docker archive, and streams it over
# the existing restricted SSH account unless build_only retains an artifact.
# Production only loads the verified image
# and performs the blue-green switch; it never checks out source or compiles.
permissions:
  contents: read

concurrency:
  group: sub2api-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build verified image and optionally deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate deployment configuration
        if: ${{ !inputs.build_only }}
        env:
          DEPLOY_HOST: ${{ secrets.SUB2API_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SUB2API_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_KEY: ${{ secrets.SUB2API_DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.SUB2API_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.SUB2API_DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          command -v python3 >/dev/null
          command -v sha256sum >/dev/null
          command -v tar >/dev/null
          command -v zstd >/dev/null

      - name: Configure restricted SSH client
        if: ${{ !inputs.build_only }}
        env:
          DEPLOY_HOST: ${{ secrets.SUB2API_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SUB2API_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_KEY: ${{ secrets.SUB2API_DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.SUB2API_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.SUB2API_DEPLOY_USER }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          # GitHub secrets commonly omit the final newline. OpenSSH's key
          # loader requires it on some runner images; normalize CRLF as well.
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Checkout production source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: main

      - name: Resolve immutable build metadata
        id: metadata
        run: |
          SOURCE_COMMIT=$(git rev-parse HEAD)
          VERSION=$(tr -d '[:space:]' < backend/cmd/server/VERSION)
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo "Invalid source commit" >&2; exit 1 ;;
          esac
          test "${#SOURCE_COMMIT}" -eq 40
          case "$VERSION" in
            ''|*[!0-9A-Za-z._+-]*) echo "Invalid release version" >&2; exit 1 ;;
          esac
          BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          IMAGE_TAG="sub2api:github-${SOURCE_COMMIT}"
          {
            echo "commit=$SOURCE_COMMIT"
            echo "version=$VERSION"
            echo "build_date=$BUILD_DATE"
            echo "image_tag=$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production linux/amd64 image
        env:
          BUILD_DATE: ${{ steps.metadata.outputs.build_date }}
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --progress=plain \
            --provenance=false \
            --tag "$IMAGE_TAG" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_COMMIT}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.created=${BUILD_DATE}" \
            --build-arg "GOPROXY=https://proxy.golang.org,direct" \
            --build-arg "GOSUMDB=sum.golang.org" \
            --build-arg "COMMIT=${SOURCE_COMMIT}" \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "DATE=${BUILD_DATE}" \
            --cache-from "type=gha,scope=sub2api-production-linux-amd64" \
            --cache-to "type=gha,mode=max,scope=sub2api-production-linux-amd64" \
            --file Dockerfile \
            .

      - name: Verify image identity
        id: image
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Architecture}}')" = "amd64"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Os}}')" = "linux"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/${GITHUB_REPOSITORY}"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_COMMIT"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
          IMAGE_ID=$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')
          case "$IMAGE_ID" in
            sha256:*) ;;
            *) echo "Image ID does not use sha256: $IMAGE_ID" >&2; exit 1 ;;
          esac
          IMAGE_ID_HEX=${IMAGE_ID#sha256:}
          case "$IMAGE_ID_HEX" in
            ''|*[!0-9a-f]*) echo "Invalid image ID: $IMAGE_ID" >&2; exit 1 ;;
          esac
          test "${#IMAGE_ID_HEX}" -eq 64
          echo "id=$IMAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Prepare portable Docker archive
        id: archive
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          ARCHIVE_PATH="${RUNNER_TEMP}/sub2api-${SOURCE_COMMIT}.docker.tar.zst"
          docker image save "$IMAGE_TAG" | zstd -T0 -3 -o "$ARCHIVE_PATH"
          zstd -t --quiet "$ARCHIVE_PATH"

          ARCHIVE_CONFIG_PATH=$(
            zstd -dc -- "$ARCHIVE_PATH" \
              | tar -xOf - manifest.json \
              | python3 -c '
          import json
          import re
          import sys

          expected_tag = sys.argv[1]
          manifest = json.load(sys.stdin)
          if len(manifest) != 1:
              raise SystemExit("archive must contain exactly one image")
          entry = manifest[0]
          tags = entry.get("RepoTags") or []
          if tags != [expected_tag]:
              raise SystemExit(f"archive tag mismatch: {tags!r}")
          config = entry.get("Config")
          if not isinstance(config, str) or not re.fullmatch(
              r"(?:blobs/sha256/[0-9a-f]{64}|[0-9a-f]{64}\.json)",
              config,
          ):
              raise SystemExit(f"invalid archive config path: {config!r}")
          print(config)
          ' "$IMAGE_TAG"
          )
          ARCHIVE_CONFIG_BASENAME="${ARCHIVE_CONFIG_PATH##*/}"
          ARCHIVE_CONFIG_HEX="${ARCHIVE_CONFIG_BASENAME%.json}"
          SAVED_CONFIG_HEX=$(
            zstd -dc -- "$ARCHIVE_PATH" \
              | tar -xOf - "$ARCHIVE_CONFIG_PATH" \
              | sha256sum \
              | awk '{print $1}'
          )
          test "$SAVED_CONFIG_HEX" = "$ARCHIVE_CONFIG_HEX"

          ARCHIVE_BYTES=$(wc -c <"$ARCHIVE_PATH" | tr -d '[:space:]')
          test "$ARCHIVE_BYTES" -gt 0
          ARCHIVE_SHA256=$(sha256sum "$ARCHIVE_PATH" | awk '{print $1}')
          {
            echo "path=$ARCHIVE_PATH"
            echo "config_id=sha256:${ARCHIVE_CONFIG_HEX}"
            echo "digest=sha256:${ARCHIVE_SHA256}"
            echo "bytes=$ARCHIVE_BYTES"
          } >> "$GITHUB_OUTPUT"

      - name: Confirm main has not advanced
        env:
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          CURRENT_MAIN=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')
          test -n "$CURRENT_MAIN"
          if [ "$CURRENT_MAIN" != "$SOURCE_COMMIT" ]; then
            echo "main advanced from ${SOURCE_COMMIT} to ${CURRENT_MAIN}; refusing to deploy a stale image." >&2
            exit 1
          fi

      - name: Write candidate image metadata
        if: ${{ inputs.build_only }}
        env:
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
          VERSION: ${{ steps.metadata.outputs.version }}
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          BUILD_DATE: ${{ steps.metadata.outputs.build_date }}
          ARCHIVE_DIGEST: ${{ steps.archive.outputs.digest }}
          ARCHIVE_BYTES: ${{ steps.archive.outputs.bytes }}
        run: |
          python3 - <<'PY_METADATA'
          import json
          import os
          from pathlib import Path
          metadata = {
              "revision": os.environ["SOURCE_COMMIT"],
              "version": os.environ["VERSION"],
              "source": "https://github.com/" + os.environ["GITHUB_REPOSITORY"],
              "image_tag": os.environ["IMAGE_TAG"],
              "platform": "linux/amd64",
              "created": os.environ["BUILD_DATE"],
              "archive_digest": os.environ["ARCHIVE_DIGEST"],
              "archive_bytes": int(os.environ["ARCHIVE_BYTES"]),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
          }
          Path(os.environ["RUNNER_TEMP"], "sub2api-image-metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n"
          )
          PY_METADATA

      - name: Upload verified candidate image artifact
        if: ${{ inputs.build_only }}
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-image-${{ steps.metadata.outputs.commit }}
          path: |
            ${{ steps.archive.outputs.path }}
            ${{ runner.temp }}/sub2api-image-metadata.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload image and start verified blue-green release
        if: ${{ !inputs.build_only }}
        env:
          DEPLOY_HOST: ${{ secrets.SUB2API_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SUB2API_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.SUB2API_DEPLOY_USER }}
          ARCHIVE_DIGEST: ${{ steps.archive.outputs.digest }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o LogLevel=ERROR \
            -o ServerAliveCountMax=180 \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy-image ${SOURCE_COMMIT} ${VERSION} ${ARCHIVE_DIGEST}" \
            < "$ARCHIVE_PATH"

      - name: Record release summary
        env:
          BUILD_ONLY: ${{ inputs.build_only }}
          ARCHIVE_BYTES: ${{ steps.archive.outputs.bytes }}
          ARCHIVE_CONFIG_ID: ${{ steps.archive.outputs.config_id }}
          ARCHIVE_DIGEST: ${{ steps.archive.outputs.digest }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          {
            echo "### Sub2API verified image"
            echo
            echo "- Commit: \`${SOURCE_COMMIT}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Runner image ID: \`${IMAGE_ID}\`"
            echo "- Archive config ID: \`${ARCHIVE_CONFIG_ID}\`"
            echo "- Compressed archive digest: \`${ARCHIVE_DIGEST}\`"
            echo "- Compressed archive bytes: \`${ARCHIVE_BYTES}\`"
            echo "- Build: GitHub-hosted linux/amd64 runner"
            if [ "$BUILD_ONLY" = "true" ]; then
              echo "- Mode: build only; no host deployment or SSH credential setup"
              echo "- Artifact: sub2api-image-${SOURCE_COMMIT} (retained for one day)"
            else
              echo "- Production: verified image load and blue-green switch only"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
