# Transport-only ingress for sub2-tw-line-candidate (Debian 12 HAProxy).
#
# This is deliberately L4 only: HAProxy never terminates TLS, HTTP/2, SSE, or
# WebSocket traffic. Azure Caddy remains the TLS and application edge.

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    maxconn 20000

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 10s
    timeout client 1800s
    timeout server 1800s
    timeout tunnel 1800s
    timeout client-fin 1800s
    timeout server-fin 1800s

frontend ingress_http
    bind 0.0.0.0:80
    default_backend azure_http

frontend ingress_https
    bind 0.0.0.0:443
    default_backend azure_https

backend azure_http
    option tcp-check
    # Keep :80 as plain TCP. Caddy's automatic HTTP redirect listener is not
    # wrapped for PROXY protocol, so it remains a direct-origin fallback path.
    server azure_http 4.216.216.16:80 check inter 5s rise 2 fall 3

backend azure_https
    # check-ssl/check-sni verify Azure's public Caddy certificate without
    # decrypting production client traffic. verifyhost prevents a valid but
    # wrong-name certificate from making this backend healthy.
    option tcp-check
    server azure_https 4.216.216.16:443 check check-ssl check-sni api.turtleligpt.com verify required verifyhost api.turtleligpt.com ca-file /etc/ssl/certs/ca-certificates.crt inter 5s rise 2 fall 3 send-proxy-v2
